name: Manter Supabase ativo

# Faz uma leitura simples no banco a cada 3 dias, para o Supabase
# (plano gratuito) não pausar o projeto por inatividade.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/barbershops?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Resposta do Supabase: $status"
          if [ "$status" != "200" ]; then
            echo "Falha ao consultar o Supabase"
            exit 1
          fi
